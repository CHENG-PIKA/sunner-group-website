trong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>E ca href=\"#/about\">关于圣农\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>ABOUT SUNNER\u003c/span>\u003cstrong>关于圣农\u003c/strong>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/about/overview\">\u003cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003 >企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u00
