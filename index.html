<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="圣农集团企业官网静态网页">
<meta name="theme-color" content="#23410f">
<title>圣农集团｜从一粒种，到一桌安心</title>
<style>

:root {
  --green: #73bc25;
  --green-dark: #73bc25;
  --green-deep: #73bc25;
  --on-green: #fff;
  --gold: #c8a35a;
  --gold-dark: #8e7137;
  --warm: #f7f4ec;
  --paper: #fff;
  --ink: #1a1a1a;
  --muted: #6c6a65;
  --line: #e1dfd6;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
  --header-height: 76px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--warm); color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6; }
body, button, input { font: inherit; }
a { color: inherit; text-decoration: none; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
img { display: block; max-width: 100%; }
.shell { width: min(1280px, calc(100% - 64px)); margin-inline: auto; }
.section-pad { padding-block: 112px; }
.skip-link { position: fixed; left: 16px; top: -80px; z-index: 1000; background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 6px; }
.skip-link:focus { top: 12px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.page-transition { position: fixed; z-index: 1000; inset: 0; pointer-events: none; background: var(--warm); opacity: 0; transition: opacity 280ms ease-out; will-change: opacity; }
.page-transition.is-active { pointer-events: auto; opacity: 1; transition-duration: 240ms; transition-timing-function: ease-in; }

.site-header { height: var(--header-height); position: fixed; inset: 0 0 auto; z-index: 100; display: flex; align-items: center; padding: 0 28px; gap: 30px; color: #fff; background: rgba(20, 20, 20, 0.82); border-bottom: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(16px); }
.brand { display: inline-flex; align-items: center; min-width: 124px; height: 70px; }
.brand-logo { width: 112px; height: auto; object-fit: contain; }
.desktop-nav { display: flex; align-items: stretch; justify-content: center; height: 100%; flex: 1; }
.nav-item { height: 100%; display: grid; place-items: center; }
.nav-item > a { padding: 26px 10px; font-size: 13px; white-space: nowrap; transition: color .2s ease; }
.nav-item:hover > a { color: var(--green); }
.mega-menu { position: fixed; left: 0; right: 0; top: var(--header-height); display: grid; grid-template-columns: .8fr 1.4fr; gap: 72px; padding: 48px max(6vw, 48px) 56px; color: var(--ink); background: rgba(247,244,236,.98); box-shadow: var(--shadow); opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity .2s ease, transform .2s ease, visibility .2s; }
.nav-item:hover .mega-menu, .nav-item:focus-within .mega-menu { opacity: 1; visibility: visible; transform: none; }
.mega-intro span { color: var(--green-dark); font-size: 11px; letter-spacing: .18em; }
.mega-intro strong { display: block; font-size: 32px; margin: 10px 0 12px; }
.mega-intro p { color: var(--muted); max-width: 440px; }
.mega-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.mega-links a { padding: 16px; border-top: 1px solid var(--line); transition: background .2s ease; }
.mega-links a:hover { background: #fff; }
.mega-links strong, .mega-links span { display: block; }
.mega-links span { color: var(--muted); font-size: 12px; margin-top: 6px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-actions button, .header-actions a { min-height: 44px; border: 0; background: transparent; color: #fff; padding: 10px 12px; cursor: pointer; font-size: 13px; }
.header-report { border: 1px solid rgba(255,255,255,.35) !important; border-radius: 999px; }
.menu-toggle { display: none; }

.eyebrow { display: inline-block; color: var(--green-dark); font-size: 11px; font-weight: 700; letter-spacing: .2em; margin-bottom: 20px; }
.eyebrow.light { color: #fff; }
.home-hero { min-height: 100svh; position: relative; display: grid; align-items: end; overflow: hidden; background: var(--green-deep); color: #fff; }
.home-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video-hero { isolation: isolate; background: #0b0d0a; }
.hero-video-stage { position: absolute; z-index: -2; inset: 0; }
.hero-video-stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.012); transition: opacity .65s ease, transform 1.1s ease; pointer-events: none; }
.hero-video-stage video.is-active { opacity: 1; transform: scale(1); }
.hero-video-shade { position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.22) 0%, transparent 38%, rgba(0,0,0,.42) 100%); pointer-events: none; }
.hero-video-controls { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 36px; }
.hero-video-tabs { display: flex; gap: 10px; }
.hero-video-tabs button { width: 70px; min-height: 48px; display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(0,0,0,.28); color: #fff; cursor: pointer; backdrop-filter: blur(8px); transition: width .25s ease, background .25s ease, border-color .25s ease; }
.hero-video-tabs button span { font-size: 11px; }
.hero-video-tabs button i { height: 2px; background: rgba(255,255,255,.45); }
.hero-video-tabs button.is-active { width: 104px; background: rgba(115,188,37,.88); border-color: var(--green); }
.hero-video-tabs button.is-active i { background: #fff; }
.hero-video-actions { display: flex; gap: 8px; }
.hero-video-actions button { min-width: 88px; min-height: 46px; padding: 9px 16px; border: 1px solid rgba(255,255,255,.42); border-radius: 999px; background: rgba(0,0,0,.32); color: #fff; cursor: pointer; font-size: 12px; backdrop-filter: blur(8px); transition: background .2s ease, border-color .2s ease; }
.hero-video-actions button:hover { background: var(--green); border-color: var(--green); }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.42) 58%, rgba(0,0,0,.15)), linear-gradient(0deg, rgba(0,0,0,.55), transparent 55%); }
.hero-content { position: relative; z-index: 1; padding-bottom: 10vh; padding-top: calc(var(--header-height) + 80px); }
.hero-content h1 { font-size: clamp(42px, 5.2vw, 76px); line-height: 1.14; letter-spacing: -.04em; max-width: 980px; margin: 0; }
.hero-content > p { max-width: 720px; font-size: 18px; line-height: 1.8; color: rgba(255,255,255,.82); margin: 28px 0 36px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.button { min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 28px; padding: 12px 22px; border-radius: 999px; font-weight: 650; cursor: pointer; transition: transform .2s ease, background .2s ease, color .2s ease; }
.button:hover { transform: translateY(-2px); }
.button-primary { background: var(--green); color: var(--on-green); }
.button-primary:hover { background: var(--green); }
.button-secondary { border: 1px solid var(--ink); background: transparent; color: var(--ink); }
.button-secondary:hover { border-color: var(--green); background: var(--green); color: #fff; }
.button-ghost { border: 1px solid rgba(255,255,255,.55); color: #fff; }
.button-ghost:hover { background: #fff; color: var(--ink); }
.button-dark { background: var(--ink); color: #fff; }
.button-light { background: #fff; color: var(--ink); }
.stock-tag { display: inline-block; margin-top: 36px; font-size: 12px; letter-spacing: .06em; color: rgba(255,255,255,.62); }
.scroll-hint { position: absolute; right: 24px; bottom: 32px; z-index: 2; writing-mode: vertical-rl; font-size: 11px; letter-spacing: .2em; opacity: .7; }

.trust-strip { background: var(--green); color: var(--on-green); }
.trust-inner { min-height: 76px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
.trust-inner span { text-align: center; padding: 18px; font-size: 13px; border-right: 1px solid rgba(255,255,255,.18); }
.trust-inner span:last-child { border: 0; }
.intro-section { display: grid; grid-template-columns: 1.08fr .92fr; gap: clamp(46px, 6vw, 96px); align-items: center; }
.intro-section h2, .section-heading h2, .feature-copy h2, .page-intro h2 { font-size: clamp(36px, 4.2vw, 60px); line-height: 1.16; letter-spacing: -.04em; margin: 0; }
.intro-section h2 { max-width: 760px; font-size: clamp(34px, 3.35vw, 50px); }
.intro-kicker { margin: 18px 0 18px; color: var(--green-dark); font-size: 14px; font-weight: 700; letter-spacing: .08em; }
.intro-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 42px; }
.intro-stock { margin: 24px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .04em; }
.intro-visual { min-height: 460px; height: min(36vw, 560px); margin: 0; overflow: hidden; background: #e3e4de; }
.intro-visual img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s ease; }
.intro-visual:hover img { transform: scale(1.025); }
.intro-copy { padding-bottom: 8px; }
.intro-copy p, .split-heading > p { color: var(--muted); font-size: 18px; line-height: 1.8; }
.text-link { display: inline-flex; gap: 26px; align-items: center; font-weight: 700; border-bottom: 1px solid var(--ink); padding-bottom: 7px; margin-top: 18px; }

.credential-section { min-height: 480px; position: relative; display: grid; place-items: center; overflow: hidden; color: #fff; background: #173413; }
.credential-section > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.credential-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,36,26,.8), rgba(10,45,31,.6)), linear-gradient(0deg, rgba(0,0,0,.42), rgba(0,0,0,.08)); }
.credential-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: stretch; padding-block: 82px; }
.credential-grid > div { min-height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 28px 22px; text-align: center; border-left: 1px solid rgba(255,255,255,.3); }
.credential-grid > div:last-child { border-right: 1px solid rgba(255,255,255,.3); }
.credential-grid strong { color: #fff; font-size: clamp(21px, 1.7vw, 30px); line-height: 1.3; letter-spacing: -.03em; }
.credential-grid span { color: rgba(255,255,255,.86); font-size: 14px; line-height: 1.65; }

.chain-section { background: #fff; }
.split-heading { display: grid; grid-template-columns: 1.2fr .8fr; gap: 120px; align-items: end; }
.split-heading > p { margin: 0 0 8px; }
.chain-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); margin-top: 64px; }
.chain-card { min-height: 450px; padding: 28px; display: flex; flex-direction: column; border-right: 1px solid var(--line); transition: background .25s ease, color .25s ease; }
.chain-card:last-child { border: 0; }
.chain-card:hover { background: var(--green); color: var(--on-green); }
.chain-meta { display: flex; justify-content: space-between; color: var(--green-dark); font-size: 12px; }
.chain-card:hover .chain-meta { color: var(--on-green); }
.chain-card h3 { font-size: 34px; font-weight: 500; margin: 86px 0 18px; }
.chain-card p { color: var(--muted); margin: 0; }
.chain-card:hover p { color: rgba(255,255,255,.78); }
.chain-stat { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.card-arrow { font-size: 12px; margin-top: 14px; opacity: .7; }
.chain-close { text-align: center; font-size: 24px; margin: 90px auto 0; line-height: 1.6; }
.chain-close strong { color: var(--green-dark); }

.section-heading { margin-bottom: 54px; }
.products-section { background: #f1f2ef; overflow: hidden; }
.products-heading { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin-bottom: 56px; }
.products-heading h2 { font-size: clamp(40px, 4.2vw, 60px); line-height: 1.1; margin: 0; }
.brand-switch { display: flex; gap: 8px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.brand-switch button { min-width: 148px; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 20px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; transition: background .22s ease, color .22s ease; }
.brand-switch button small { font-size: 9px; letter-spacing: .12em; }
.brand-switch button span { font-size: 16px; font-weight: 700; }
.brand-switch button.is-active { background: var(--green); color: #fff; }
.product-brand-panel { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: clamp(32px, 4vw, 68px); align-items: start; }
.product-brand-panel[hidden] { display: none; }
.product-series { display: grid; align-content: start; border-top: 1px solid var(--line); }
.product-series button { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: color .2s ease, padding .2s ease; }
.product-series button span { font-size: 19px; }
.product-series button i { font-style: normal; opacity: 0; transform: translateX(-8px); transition: opacity .2s ease, transform .2s ease; }
.product-series button:hover, .product-series button.is-active { color: var(--green); padding-left: 12px; }
.product-series button:hover i, .product-series button.is-active i { opacity: 1; transform: none; }
.product-stage { min-width: 0; }
.product-stage-head { min-height: 82px; display: flex; align-items: start; justify-content: space-between; gap: 24px; }
.product-stage-head small { color: var(--green); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
.product-stage-head h3 { font-size: 28px; line-height: 1.3; margin: 5px 0 0; }
.product-stage-head > a { min-height: 50px; display: inline-flex; align-items: center; gap: 28px; padding: 10px 22px; background: var(--green); color: #fff; font-size: 14px; white-space: nowrap; }
.product-viewport { overflow: hidden; }
.product-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 32px) / 3); gap: 16px; animation: product-fade .28s ease both; }
.catalog-product-card { min-width: 0; display: flex; flex-direction: column; padding: 16px 16px 22px; background: #fff; transition: transform .22s ease, box-shadow .22s ease; }
.catalog-product-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(20,36,10,.1); }
.catalog-product-image { aspect-ratio: 1 / 1; display: grid; place-items: center; overflow: hidden; background: #fff; }
.catalog-product-image img { width: 100%; height: 100%; object-fit: contain; transition: transform .35s ease; }
.catalog-product-card:hover img { transform: scale(1.025); }
.catalog-product-card strong { display: block; margin: 18px 0 3px; font-size: 17px; line-height: 1.45; }
.catalog-product-card > span { color: var(--muted); font-size: 12px; }
.product-controls { display: flex; gap: 10px; margin-top: 18px; }
.product-controls button { width: 48px; height: 48px; border: 1px solid #bac2b6; background: transparent; color: var(--green); cursor: pointer; font-size: 20px; transition: background .2s ease, color .2s ease, border-color .2s ease; }
.product-controls button:hover { background: var(--green); color: #fff; border-color: var(--green); }
@keyframes product-fade { from { opacity: .55; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.base-section { background: var(--green); color: var(--on-green); }
.base-section .eyebrow.light, .conversion-section .eyebrow.light, .page-cta .eyebrow.light { color: var(--on-green); }
.base-section .split-heading > p { color: rgba(255,255,255,.82); }
.base-gallery { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; height: clamp(340px, 32vw, 480px); }
.base-gallery figure { margin: 0; position: relative; overflow: hidden; outline: 0; cursor: default; background: var(--green); }
.base-gallery figure::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 36%, rgba(0,0,0,.72) 100%); opacity: 0; transition: opacity .32s ease; pointer-events: none; }
.base-gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .55s ease, filter .32s ease; }
.base-gallery figcaption { position: absolute; z-index: 2; inset: auto 0 0; display: grid; gap: 8px; padding: 26px 20px; color: #fff; opacity: 0; visibility: hidden; transform: translateY(14px); transition: opacity .32s ease, transform .32s ease, visibility .32s; }
.base-gallery figcaption small { font-size: 11px; letter-spacing: .16em; opacity: .76; }
.base-gallery figcaption span { font-size: clamp(17px, 1.35vw, 22px); font-weight: 700; line-height: 1.35; }
.base-gallery figure:hover::after, .base-gallery figure:focus-visible::after { opacity: 1; }
.base-gallery figure:hover img, .base-gallery figure:focus-visible img { transform: scale(1.045); filter: saturate(1.04); }
.base-gallery figure:hover figcaption, .base-gallery figure:focus-visible figcaption { opacity: 1; visibility: visible; transform: translateY(0); }
.base-gallery figure:focus-visible { box-shadow: inset 0 0 0 3px #fff; }

.capability-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.capability-card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: #fff; transition: transform .22s ease, box-shadow .22s ease; }
.capability-card:hover, .capability-card:focus-visible { transform: translateY(-4px); box-shadow: 0 18px 42px rgba(20,36,10,.12); }
.capability-media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #e7e8e3; }
.capability-media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.025); transition: opacity .4s ease, transform .8s ease; }
.capability-media > img.is-active { opacity: 1; transform: scale(1); }
.capability-dots { position: absolute; z-index: 3; left: 20px; bottom: 18px; display: flex; gap: 7px; }
.capability-dots i { width: 18px; height: 3px; background: rgba(255,255,255,.48); box-shadow: 0 1px 4px rgba(0,0,0,.18); transition: width .25s ease, background .25s ease; }
.capability-dots i.is-active { width: 34px; background: #fff; }
.capability-hover-hint { position: absolute; z-index: 3; right: 16px; top: 16px; padding: 7px 10px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; letter-spacing: .08em; opacity: 0; transform: translateY(-4px); transition: opacity .22s ease, transform .22s ease; }
.capability-card:hover .capability-hover-hint, .capability-card:focus-visible .capability-hover-hint { opacity: 1; transform: none; }
.capability-copy { display: flex; flex: 1; flex-direction: column; padding: 28px; }
.capability-copy > span, .news-card > span { color: var(--green-dark); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.capability-copy h3 { font-size: 25px; line-height: 1.4; margin: 12px 0 8px; }
.capability-copy p { color: var(--muted); margin: 0; }
.capability-copy strong { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; }
.capability-copy strong i { color: var(--green); font-size: 18px; font-style: normal; transition: transform .2s ease; }
.capability-card:hover .capability-copy strong i { transform: translateX(4px); }
.news-section { background: #efede5; }
.news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.news-card { background: #fff; padding-bottom: 28px; }
.news-card img { aspect-ratio: 16 / 10; width: 100%; object-fit: cover; margin-bottom: 24px; }
.news-card > span, .news-card h3, .news-card strong { margin-left: 24px; margin-right: 24px; }
.news-card h3 { font-size: 23px; line-height: 1.5; min-height: 70px; }
.news-card strong { font-size: 13px; }

.conversion-section { background: var(--green); color: var(--on-green); }
.conversion-heading { text-align: center; }
.conversion-heading h2 { font-size: clamp(38px, 4.4vw, 62px); margin: 0; }
.conversion-heading p { color: rgba(255,255,255,.82); }
.conversion-grid { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 56px; border: 1px solid rgba(255,255,255,.3); }
.conversion-card { min-height: 320px; padding: 28px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,.3); transition: background .2s ease, color .2s ease; }
.conversion-card:last-child { border: 0; }
.conversion-card:hover { background: #fff; color: var(--ink); }
.conversion-card > span { font-size: 12px; color: var(--on-green); }
.conversion-card:hover > span { color: var(--green-dark); }
.conversion-card h3 { font-size: 24px; margin: 70px 0 10px; }
.conversion-card p { color: rgba(255,255,255,.8); margin: 0; }
.conversion-card:hover p { color: var(--muted); }
.conversion-card strong { margin-top: auto; font-size: 13px; }

.site-footer { background: #1a1a1a; color: #fff; padding: 80px max(4vw, 32px) 28px; display: grid; grid-template-columns: 280px 1fr; gap: 80px; }
.brand-light { color: #fff; }
.footer-lead p { color: rgba(255,255,255,.62); margin: 32px 0; }
.hotline { display: block; font-size: 26px; font-weight: 700; }
.footer-lead > small { color: rgba(255,255,255,.48); }
.footer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 28px; }
.footer-grid > div { display: grid; align-content: start; gap: 8px; }
.footer-grid a { color: rgba(255,255,255,.55); font-size: 13px; }
.footer-grid a:hover { color: #fff; }
.footer-title { color: #fff !important; font-weight: 700; margin-bottom: 8px; }
.footer-bottom { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 24px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 24px; color: rgba(255,255,255,.42); font-size: 11px; }

.drawer-backdrop, .search-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.68); backdrop-filter: blur(12px); }
.mobile-drawer { width: min(520px, 92vw); height: 100%; margin-left: auto; overflow: auto; background: var(--warm); color: var(--ink); padding: 28px; }
.drawer-top, .search-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.drawer-top button, .search-top button { min-width: 48px; min-height: 44px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
.drawer-group { border-top: 1px solid var(--line); padding: 18px 0; }
.drawer-group > a { font-size: 22px; font-weight: 700; }
.drawer-group div { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
.drawer-group div a { font-size: 13px; color: var(--muted); }
.search-overlay { display: grid; place-items: start center; padding-top: 10vh; }
.search-panel { width: min(780px, calc(100% - 32px)); max-height: 80vh; overflow: auto; background: var(--warm); padding: 34px; box-shadow: var(--shadow); }
.search-panel label { display: block; font-size: 13px; margin-bottom: 8px; }
.search-panel input { width: 100%; min-height: 58px; border: 1px solid var(--line); background: #fff; padding: 12px 16px; font-size: 18px; }
.search-results { margin-top: 18px; display: grid; }
.search-results a { padding: 16px 4px; border-top: 1px solid var(--line); display: grid; }
.search-results span { color: var(--muted); font-size: 13px; margin-top: 4px; }

.inner-hero { min-height: 610px; position: relative; display: flex; align-items: end; color: #fff; background: var(--green-deep); }
.inner-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.inner-hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.18)), linear-gradient(0deg, rgba(0,0,0,.55), transparent); }
.inner-hero-content { position: relative; z-index: 1; padding-bottom: 72px; padding-top: 150px; }
.breadcrumbs { display: flex; gap: 10px; margin-bottom: 70px; font-size: 12px; color: rgba(255,255,255,.62); }
.inner-hero h1 { font-size: clamp(48px, 6vw, 84px); line-height: 1; letter-spacing: -.05em; margin: 0; }
.inner-hero-content > p { max-width: 680px; color: rgba(255,255,255,.78); font-size: 18px; margin-top: 24px; }
.subnav { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: var(--header-height); z-index: 30; }
.subnav .shell { display: flex; gap: 30px; overflow-x: auto; }
.subnav a { min-height: 58px; display: grid; place-items: center; white-space: nowrap; font-size: 13px; border-bottom: 2px solid transparent; }
.subnav a.active { color: var(--green-dark); border-bottom-color: var(--green); font-weight: 700; }
.page-intro { display: grid; grid-template-columns: 1.1fr .9fr; gap: 110px; }
.page-intro > div:last-child { color: var(--muted); font-size: 17px; }
.metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border: 1px solid var(--line); }
.metrics-row div { padding: 38px; border-right: 1px solid var(--line); display: grid; gap: 6px; }
.metrics-row div:last-child { border: 0; }
.metrics-row strong { font-size: clamp(34px, 4vw, 52px); color: var(--green-dark); }
.metrics-row span { color: var(--muted); font-size: 13px; }
.feature-story { display: grid; grid-template-columns: 1.1fr .9fr; min-height: 600px; }
.feature-image img { width: 100%; height: 100%; min-height: 560px; object-fit: cover; }
.feature-copy { background: var(--green); color: var(--on-green); padding: 70px; display: flex; flex-direction: column; justify-content: center; }
.feature-copy .eyebrow { color: var(--on-green); }
.feature-copy p { color: rgba(255,255,255,.82); margin: 28px 0; }
.feature-copy .button { align-self: flex-start; }
.module-section { background: #fff; }
.module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.module-card { min-height: 300px; padding: 28px; background: var(--warm); display: flex; flex-direction: column; transition: background .2s ease, color .2s ease; }
.module-card:hover { background: var(--green); color: var(--on-green); }
.module-card > span { color: var(--green-dark); font-size: 12px; }
.module-card:hover > span { color: var(--on-green); }
.module-card h3 { font-size: 25px; margin: 60px 0 10px; }
.module-card p { color: var(--muted); margin: 0; }
.module-card:hover p { color: rgba(255,255,255,.8); }
.module-card strong { margin-top: auto; font-size: 13px; }
.page-cta { background: var(--green); color: var(--on-green); padding: 72px 0; }

.page-cta h2 { font-size: clamp(34px, 4vw, 54px); line-height: 1.2; margin: 0; }

.not-found { min-height: 100vh; display: grid; place-content: center; text-align: center; }

@media (max-width: 1180px) {
  .desktop-nav { display: none; }
  .site-header { justify-content: space-between; }
  .header-actions { margin-left: auto; }
  .menu-toggle { display: inline-block; }

  .footer-grid { grid-template-columns: repeat(2, 1fr); }

  .base-gallery figure { scroll-snap-align: start; }
  .product-track { grid-auto-columns: calc((100% - 16px) / 2); }
  .credential-grid { grid-template-columns: repeat(3, 1fr); }
  .credential-grid > div { border-bottom: 1px solid rgba(255,255,255,.25); }
}

@media (max-width: 760px) {

  .scroll-hint { display: none; }

  .inner-hero { min-height: 540px; }
  .breadcrumbs { margin-bottom: 46px; overflow-x: auto; }

  .feature-copy { padding: 48px 24px; }
  .feature-image img { min-height: 380px; }
  .page-cta .shell > div:last-child { align-items: flex-start; flex-direction: column; }

@media (hover: none) {
  .base-gallery figure::after { opacity: 1; }
  .base-gallery figcaption { opacity: 1; visibility: visible; transform: none; }
}

}

{"/":"\u003cdiv class=\"page-transition is-active\" aria-hidden=\"true\">\u003c/div>\u003ca class=\"skip-link\" href=\"#main-content\">跳至主要内容\u003c/a>\u003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"#/\" aria-label=\"圣农集团官网首页\" data-home-link=\"true\">\u003cimg class=\"brand-logo\" src=\"./assets/brand-logo-4629f738aea0.png\" alt=\"\"/>\u003c/a>\u003cnav class=\"desktop-nav\" aria-label=\"主导航\">\u003cdiv class=\"nav-item\">\u003ca href=\"#/about\">关于圣农\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>ABOUT SUNNER\u003c/span>\u003cstrong>关于圣农\u003c/strong>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/about/overview\">\u003cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003c/strong>\u003cspan>获取投资者沟通方式与常见信息。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/news\">新闻与媒体\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>NEWS &amp; MEDIA\u003c/span>\u003cstrong>新闻与媒体\u003c/strong>\u003cp>了解集团动态、产业观察与可下载的品牌媒体资源。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/news/group\">\u003cstrong>集团新闻\u003c/strong>\u003cspan>关注企业经营、创新与产业建设动态。\u003c/span>\u003c/a>\u003ca href=\"#/news/industry\">\u003cstrong>行业动态\u003c/strong>\u003cspan>聚焦白羽肉鸡、食品安全与产业趋势。\u003c/span>\u003c/a>\u003ca href=\"#/news/media\">\u003cstrong>媒体资源\u003c/strong>\u003cspan>下载品牌资料、图片与视频资源。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/careers\">人才招聘\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>CAREERS\u003c/span>\u003cstrong>人才招聘\u003c/strong>\u003cp>与 3 万+ 团队一起，把专业、热爱与长期主义带到更远。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/careers/campus\">\u003cstrong>校园招聘\u003c/strong>\u003cspan>面向应届毕业生的岗位、培养与申请入口。\u003c/span>\u003c/a>\u003ca href=\"#/careers/social\">\u003cstrong>社会招聘\u003c/strong>\u003cspan>面向专业人才开放多领域职业机会。\u003c/span>\u003c/a>\u003ca href=\"#/careers/development\">\u003cstrong>人才发展\u003c/strong>\u003cspan>了解成长通道、学习机制与人才理念。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/nav>\u003cdiv class=\"header-actions\">\u003cbutton type=\"button\">搜索\u003c/button>\u003ca class=\"header-report\" href=\"#/sustainability/esg\">ESG 报告\u003c/a>\u003cbutton class=\"menu-toggle\" type=\"button\">菜单\u003c/button>\u003c/div>\u003c/header>\u003cmain id=\"main-content\">\u003csection class=\"home-hero video-hero\" data-video-hero=\"true\" aria-label=\"圣农集团品牌视频\">\u003cdiv class=\"hero-video-stage\">\u003cvideo class=\"is-active\" src=\"./assets/hero-brand-opening-a97db062af38.mp4\" poster=\"./assets/hero-brand-opening-poster-f6f71fbd1ab4.jpg\" muted=\"\" autoPlay=\"\" playsInline=\"\" preload=\"auto\" aria-hidden=\"false\" data-hero-video=\"0\">\u003c/video>\u003cvideo class=\"\" data-video-source=\"./assets/hero-food-processing-1c1e6c9bbd69.mp4\" poster=\"./assets/hero-food-processing-poster-f6d1e353c960.jpg\" muted=\"\" playsInline=\"\" preload=\"auto\" aria-hidden=\"true\" data-hero-video=\"1\">\u003c/video>\u003cvideo class=\"\" data-video-source=\"./assets/hero-shengxiaonong-afb4673d1791.mp4\" poster=\"./assets/hero-shengxiaonong-poster-358387d5f44d.jpg\" muted=\"\" playsInline=\"\" preload=\"auto\" aria-hidden=\"true\" data-hero-video=\"2\">\u003c/video>\u003c/div>\u003cdiv class=\"hero-video-shade\">\u003c/div>\u003cdiv class=\"hero-video-controls shell\">\u003cdiv class=\"hero-video-tabs\" role=\"tablist\" aria-label=\"选择首屏视频\">\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"true\" aria-label=\"播放圣农品牌片\" class=\"is-active\" data-video-index=\"0\">\u003cspan>01\u003c/span>\u003ci>\u003c/i>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"false\" aria-label=\"播放食品深加工厂\" class=\"\" data-video-index=\"1\">\u003cspan>02\u003c/span>\u003ci>\u003c/i>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"false\" aria-label=\"播放圣小农\" class=\"\" data-video-index=\"2\">\u003cspan>03\u003c/span>\u003ci>\u003c/i>\u003c/button>\u003c/div>\u003cdiv class=\"hero-video-actions\">\u003cbutton type=\"button\" data-video-pause=\"true\" aria-label=\"暂停视频\">暂停\u003c/button>\u003cbutton type=\"button\" data-video-mute=\"true\" aria-label=\"开启视频声音\">开启声音\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"intro-section shell section-pad\" id=\"intro\">\u003cdiv class=\"intro-message\">\u003cspan class=\"eyebrow\">ABOUT SUNNER\u003c/span>\u003cp class=\"intro-kicker\">自主育种 · 中国白羽肉鸡全产业链龙头企业\u003c/p>\u003ch2>一家只购买饲料原料，\u003cbr/>就能源源不断生产鸡肉的公司\u003c/h2>\u003cdiv class=\"intro-actions\">\u003ca class=\"button button-primary\" href=\"#/about\">了解圣农的故事 \u003cspan>→\u003c/span>\u003c/a>\u003ca class=\"button button-secondary\" href=\"#/chain\">探索全产业链 \u003cspan>→\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"intro-stock\">上市公司：福建圣农发展（002299）\u003c/p>\u003c/div>\u003cfigure class=\"intro-visual\">\u003cimg src=\"./assets/about-chain-aerial-a440e1edb6cd.jpg\" alt=\"青山环抱中的圣农现代化养殖基地\" loading=\"lazy\"/>\u003c/figure>\u003c/section>\u003csection class=\"credential-section\" aria-label=\"圣农集团品牌与行业资质\">\u003cimg src=\"./assets/chain-farm-1-930b63518774.jpg\" alt=\"青山绿水间的圣农产业基地\" loading=\"lazy\"/>\u003cdiv class=\"credential-shade\">\u003c/div>\u003cdiv class=\"credential-grid shell\">\u003cdiv>\u003cstrong>农业产业化国家\u003cbr/>重点龙头企业\u003c/strong>\u003c/div>\u003cdiv>\u003cstrong>中国现代农业\u003c/strong>\u003cspan>可持续发展典范\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>中国民营企业\u003cbr/>500 强\u003c/strong>\u003cspan>2018—2025\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>中国食品\u003cbr/>安全十强\u003c/strong>\u003cspan>2011—2016\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>超 130 亿\u003c/strong>\u003cspan>2026 品牌价值\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>中国首家肉鸡\u003c/strong>\u003cspan>动物福利＋非笼养鸡\u003cbr/>双认证企业\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"chain-section section-pad\">\u003cdiv class=\"shell section-heading split-heading\">\u003cdiv>\u003cspan class=\"eyebrow\">FULL INDUSTRIAL CHAIN\u003c/span>\u003ch2>从一粒种，\u003cbr/>到一桌安心\u003c/h2>\u003c/div>\u003cp>从种源安全到食品安全，不是简单相加，而是一套能够被追溯、被验证、被信赖的完整系统。\u003c/p>\u003c/div>\u003cdiv class=\"chain-grid shell\">\u003ca class=\"chain-card\" href=\"#/breeding\">\u003cdiv class=\"chain-meta\">\u003cspan>01\u003c/span>\u003cspan>自主育种\u003c/span>\u003c/div>\u003ch3>一粒种\u003c/h3>\u003cp>自主育种，打破白羽肉鸡种源依赖。\u003c/p>\u003cdiv class=\"chain-stat\">累计研发投入超 15 亿元\u003c/div>\u003cspan class=\"card-arrow\">了解更多 →\u003c/span>\u003c/a>\u003ca class=\"chain-card\" href=\"#/chain\">\u003cdiv class=\"chain-meta\">\u003cspan>02\u003c/span>\u003cspan>智慧养殖\u003c/span>\u003c/div>\u003ch3>一只鸡\u003c/h3>\u003cp>从种鸡、饲料、养殖到食品智造与冷链。\u003c/p>\u003cdiv class=\"chain-stat\">年肉鸡养殖能力超 8 亿羽\u003c/div>\u003cspan class=\"card-arrow\">了解更多 →\u003c/span>\u003c/a>\u003ca class=\"chain-card\" href=\"#/products/safety\">\u003cdiv class=\"chain-meta\">\u003cspan>03\u003c/span>\u003cspan>食品智造\u003c/span>\u003c/div>\u003ch3>一桌饭\u003c/h3>\u003cp>自宰、自检、深加工，用全链路标准守护品质。\u003c/p>\u003cdiv class=\"chain-stat\">142 道品质保障工序\u003c/div>\u003cspan class=\"card-arrow\">了解更多 →\u003c/span>\u003c/a>\u003ca class=\"chain-card\" href=\"#/sustainability\">\u003cdiv class=\"chain-meta\">\u003cspan>04\u003c/span>\u003cspan>绿色循环\u003c/span>\u003c/div>\u003ch3>一片绿\u003c/h3>\u003cp>让养殖废弃物转化为清洁能源与再生资源。\u003c/p>\u003cdiv class=\"chain-stat\">累计生物质发电达 22 亿度\u003c/div>\u003cspan class=\"card-arrow\">了解更多 →\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"chain-close\">43 年，从南平光泽走向世界餐桌。\u003cbr/>\u003cstrong>这是圣农的答案。\u003c/strong>\u003c/p>\u003c/section>\u003csection class=\"products-section section-pad\" data-product-showcase=\"true\">\u003cdiv class=\"shell products-heading\">\u003cdiv>\u003cspan class=\"eyebrow\">OUR PRODUCTS\u003c/span>\u003ch2>探索产品\u003c/h2>\u003c/div>\u003cdiv class=\"brand-switch\" role=\"tablist\" aria-label=\"选择产品品牌\">\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"true\" aria-controls=\"product-panel-sunner\" class=\"is-active\" data-brand=\"sunner\">\u003csmall>SUNNER FOODS\u003c/small>\u003cspan>圣农\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"product-panel-sunvalley\" class=\"\" data-brand=\"sunvalley\"> us\">\u003cstrong>校园招聘\u003c/strong>\u003cspan>面向应届毕业生的岗位、培养与申请入口。\u003c/span>\u003c/a>\u003ca href=\"#/careers/social\">\u003cstrong>社会招聘\u003c/strong>\u003cspan>面向专业人才开放多领域职业机会。\u003c/span>\u003c/a>\u003ca href=\"#/careers/development\">\u003cstrong>人才发展\u003c/strong>\u003cspan>了解成长通道、学习机制与人才理念。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/nav>\u003cdiv class=\"header-actions\">\u003cbutton type=\"button\">搜索\u003c/button>\u003ca class=\"header-report\" href=\"#/sustainability/esg\">ESG 报告\u003c/a>\u003cbutton class=\"menu-toggle\" type=\"button\">菜单\u003c/button>\u003c/div>\u003c/header>\u003cmain id=\"main-content\">\u003csection class=\"inner-hero\">\u003cimg src=\"./assets/campus-guangze-d210a4f41301.jpg\" alt=\"\"/>\u003cdiv class=\"inner-hero-shade\">\u003c/div>\u003cdiv class=\"shell inner-hero-content\">\u003cdiv class=\"breadcrumbs\">\u003ca href=\"#/\">首页\u003c/a>\u003cspan>/\u003c/span>\u003ca href=\"#/about\">关于圣农\u003c/a>\u003c/div>\u003cspan class=\"eyebrow light\">ABOUT SUNNER\u003c/span>\u003ch1>关于圣农\u003c/h1>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003c/section>\u003cnav class=\"subnav\" aria-label=\"关于圣农栏目导航\">\u003cdiv class=\"shell\">\u003ca class=\"active\" href=\"#/about\">栏目首页\u003c/a>\u003ca class=\"\" href=\"#/about/overview\">企业概况\u003c/a>\u003ca class=\"\" href=\"#/about/structure\">集团架构\u003c/a>\u003ca class=\"\" href=\"#/about/history\">发展历程\u003c/a>\u003ca class=\"\" href=\"#/about/culture\">企业文化\u003c/a>\u003ca class=\"\" href=\"#/about/honors\">荣誉资质\u003c/a>\u003ca class=\"\" href=\"#/about/global\">全球布局\u003c/a>\u003c/div>\u003c/nav>\u003csection class=\"page-intro shell section-pad\">\u003cdiv>\u003cspan class=\"eyebrow\">ABOUT SUNNER\u003c/span>\u003ch2>以长期主义，建设值得信赖的产业能力\u003c/h2>\u003c/div>\u003cdiv>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003cp>本页面采用可编辑内容模块，便于在企业资料确认后接入正式正文、报告、图片或后台数据。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"metrics-row shell\">\u003cdiv>\u003cstrong>43 年\u003c/strong>\u003cspan>产业深耕\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>5 大\u003c/strong>\u003cspan>产业基地集群\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>002299\u003c/strong>\u003cspan>上市公司代码\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"feature-story shell section-pad\">\u003cdiv class=\"feature-image\">\u003cimg src=\"./assets/campus-guangze-d210a4f41301.jpg\" alt=\"关于圣农相关实景\" loading=\"lazy\"/>\u003c/div>\u003cdiv class=\"feature-copy\">\u003cspan class=\"eyebrow\">OUR APPROACH\u003c/span>\u003ch2>从源头建立标准，\u003cbr/>用全链路兑现承诺\u003c/h2>\u003cp>圣农围绕自主种源、智慧养殖、食品智造、冷链物流与绿色循环持续建设专业能力，让每一个环节都可追溯、可验证。\u003c/p>\u003ca class=\"button button-dark\" href=\"#/chain\">了解全产业链 →\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"module-section section-pad\">\u003cdiv class=\"shell section-heading\">\u003cspan class=\"eyebrow\">EXPLORE MORE\u003c/span>\u003ch2>探索本栏目\u003c/h2>\u003c/div>\u003cdiv class=\"module-grid shell\">\u003ca href=\"#/about/overview\" class=\"module-card\">\u003cspan>01\u003c/span>\u003ch3>企业概况\u003c/h3>\u003cp>了解圣农的业务版图、发展定位与核心能力。\u003c/p>\u003cstrong>查看详情 →\u003c/strong>\u003c/a>\u003ca href=\"#/about/structure\" class=\"module-card\">\u003cspan>02\u003c/span>\u003ch3>集团架构\u003c/h3>\u003cp>查看集团业务体系与协同发展的组织结构。\u003c/p>\u003cstrong>查看详情 →\u003c/strong>\u003c/a>\u003ca href=\"#/about/history\" class=\"module-card\">\u003cspan>03\u003c/span>\u003ch3>发展历程\u003c/h3>\u003cp>回望从光泽创业到全产业链布局的重要阶段。\u003c/p>\u003cstrong>查看详情 →\u003c/strong>\u003c/a>\u003ca href=\"#/about/culture\" class=\"module-card\">\u003cspan>04\u003c/span>\u003ch3>企业文化\u003c/h3>\u003cp>坚持长期主义，不负每一份信赖。\u003c/p>\u003cstrong>查看详情 →\u003c/strong>\u003c/a>\u003ca href=\"#/about/honors\" class=\"module-card\">\u003cspan>05\u003c/span>\u003ch3>荣誉资质\u003c/h3>\u003cp>汇集企业资质、行业认可与品质认证。\u003c/p>\u003cstrong>查看详情 →\u003c/strong>\u003c/a>\u003ca href=\"#/about/global\" class=\"module-card\">\u003cspan>06\u003c/span>\u003ch3>全球布局\u003c/h3>\u003cp>连接国内产业基地与面向全球的合作网络。\u003c/p>\u003cstrong>查看详情 →\u00 负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003c/strong>\u003cspan>获取投资者沟通方式与常见信息。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/news\">新闻与媒体\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>NEWS &amp; MEDIA\u003c/span>\u003cstrong>新闻与媒体\u003c/strong>\u003cp>了解集团动态、产业观察与可下载的品牌媒体资源。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/news/group\">\u003cstrong>集团新闻\u003c/strong>\u003cspan>关注企业经营、创新与产业建设动态。\u003c/span>\u003c/a>\u003ca href=\"#/news/industry\">\u003cstrong>行业动态\u003c/strong>\u003cspan>聚焦白羽肉鸡、食品安全与产业趋势。\u003c/span>\u003c/a>\u003ca href=\"#/news/media\">\u003cstrong>媒体资源\u003c/strong>\u003cspan>下载品牌资料、图片与视频资源 003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003c/strong>\u003cspan>获取投资者沟通方式与常见信息。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/news\">新闻与媒体\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>NEWS &amp; MEDIA\u003c/span>\u003cstrong>新闻与媒体\u003c/strong>\u003cp>了解集团动态、产业观察与可下载的品牌媒体资源。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/news/group\">\u003cstrong>集团新闻\u003c/strong>\u003cspan>关注企业经营、创新与产业建设动态。\u003c/span>\u003c/a>\u003ca href=\"#/news/industry\">\u003cstrong>行业动态\u003c/strong>\u003cspan>聚焦白羽肉鸡、食品安全与产业趋势。\u003c/span>\u003c/a>\u003ca href=\"#/news/media\">\u003cstrong>媒体资源\u003c/strong>\u003cspan>下载品牌资料、图片与视频资源。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/careers\">人才招聘\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>CAREERS\u003c/span>\u003cstrong>人才招聘\u003c/strong>\u003cp>与 3 万+ 团队一起，把专业、热爱与长期主义带到更远。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/careers/campus\">\u003cstrong>校园招聘\u003c/strong>\u003cspan>面向应届毕业生的岗位、培养与申请入口。\u003c/span>\u003c/a>\u003ca href=\"#/careers/social\">\u003cstrong>社会招聘\u003c/strong>\u003cspan>面向专业人才开放多领域职业机会。\u003c/span>\u003c/a>\u003ca href=\"#/careers/development\">\u003cstrong>人才发展\u003c/strong>\u003cspan>了解成长通道、学习机制与人才理念。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/nav>\u003cdiv class=\"header-actio /a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003c/strong>\u003cspan>获取投资者沟通方式与常见信息。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/news\">新闻与媒体\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>NEWS &amp; MEDIA\u003c/span>\u003cstrong>新闻与媒体\u003c/strong>\u003cp>了解集团动态、产业观察与可下载的品牌媒体资源。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/news/group\">\u003cstrong>集团新闻\u003c/strong>\u003cspan>关注企业经营、创新与产业建设动态。\u003c/span>\u003c/a>\u003ca href=\"#/news/industry\">\u003cstrong>行业动态\u003c/strong>\u003cspan>聚焦白羽肉鸡、食品安全与产业趋势。\u003c/span>\u003c/a>\u003ca href=\"#/news/media\">\u003cstrong>媒体资源\u003c/strong>\u003cspan>下载品牌资料、图片与视频资源。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/careers\">人才招聘\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>CAREERS\u003c/span>\u003cstrong>人才招聘\u003c/strong>\u003cp>与 3 万+ 团队一起，把专业、热爱与长期主义带到更远。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/c ture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunn 业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/investors/contact\">\u003cstrong>投资者联系\u003c/strong>\u003cspan>获取投资者沟通方式与常见信息。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/news\">新闻与媒体\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>NEWS &amp; MEDIA\u003c/span>\u003cstrong>新闻与媒体\u003c/strong>\u003cp>了解集团动态、产业观察与可下载的品牌媒体资源。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/news/group\">\u003cstrong>集团新闻\u003c/strong>\u003cspan>关注企业经营、创新与产业建设动态。\u003c/span>\u003c/a>\u003ca href=\"#/news/industry\">\u003cstrong>行业动态\u003c/strong>\u003cspan>聚焦白羽肉鸡、食品安全与产业趋势。\u003c/span>\u003c/a>\u003ca href=\"#/news/media\">\u003cstrong>媒体资源\u003c/strong>\u003cspan>下载品牌资料、图片与视频资源。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/care "主导航\">\u003cdiv class=\"nav-item\">\u003ca href=\"#/about\">关于圣农\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>ABOUT SUNNER\u003c/span>\u003cstrong>关于圣农\u003c/strong>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/about/overview\">\u003cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u003c/span>\u003cstrong>投资者关系\u003c/strong>\u003cp>为投资者集中提供报告、公告及沟通渠道。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/investors/reports\">\u003cstrong>财报与公告\u003c/strong>\u003cspan>查阅定期报告、公告与投资者资料。\u003c/span>\u003c/a>\u003ca href=\"#/in 003cheader class=\"site-header\">\u003ca class=\"brand\" href=\"#/\" aria-label=\"圣农集团官网首页\" data-home-link=\"true\">\u003cimg class=\"brand-logo\" src=\"./assets/brand-logo-4629f738aea0.png\" alt=\"\"/>\u003c/a>\u003cnav class=\"desktop-nav\" aria-label=\"主导航\">\u003cdiv class=\"nav-item\">\u003ca href=\"#/about\">关于圣农\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>ABOUT SUNNER\u003c/span>\u003cstrong>关于圣农\u003c/strong>\u003cp>43 年深耕白羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/about/overview\">\u003cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/sustainability/esg\">\u003cstrong>ESG 战略\u003c/strong>\u003cspan>围绕环境、社会与治理推动可持续经营。\u003c/span>\u003c/a>\u003ca href=\"#/sustainability/charity\">\u003cstrong>社会公益\u003c/strong>\u003cspan>以长期行动回馈社区、产业与社会。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/investors\">投资者关系\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INVESTOR RELATIONS\u 羽肉鸡产业，从福建光泽走向更广阔的市场。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/about/overview\">\u003cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca lass=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/sustainability\">可持续发展\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>SUSTAINABILITY\u003c/span>\u003cstrong>可持续发展\u003c/strong>\u003cp>把绿色发展写进产业链，让资源在循环中创造长期价值。\u003c/p>\u003c/div>\u 3cstrong>企业概况\u003c/strong>\u003cspan>了解圣农的业务版图、发展定位与核心能力。\u003c/span>\u003c/a>\u003ca href=\"#/about/structure\">\u003cstrong>集团架构\u003c/strong>\u003cspan>查看集团业务体系与协同发展的组织结构。\u003c/span>\u003c/a>\u003ca href=\"#/about/history\">\u003cstrong>发展历程\u003c/strong>\u003cspan>回望从光泽创业到全产业链布局的重要阶段。\u003c/span>\u003c/a>\u003ca href=\"#/about/culture\">\u003cstrong>企业文化\u003c/strong>\u003cspan>坚持长期主义，不负每一份信赖。\u003c/span>\u003c/a>\u003ca href=\"#/about/honors\">\u003cstrong>荣誉资质\u003c/strong>\u003cspan>汇集企业资质、行业认可与品质认证。\u003c/span>\u003c/a>\u003ca href=\"#/about/global\">\u003cstrong>全球布局\u003c/strong>\u003cspan>连接国内产业基地与面向全球的合作网络。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/ -item\">\u003ca href=\"#/chain\">全产业链\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>FULL INDUSTRIAL CHAIN\u003c/span>\u003cstrong>全产业链\u003c/strong>\u003cp>从祖代、父母代到商品代，从饲料、养殖到食品智造与冷链。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/chain/overview\">\u003cstrong>全产业链概况\u003c/strong>\u003cspan>一只鸡，一棵全链，一份安心。\u003c/span>\u003c/a>\u003ca href=\"#/chain/museum\">\u003cstrong>圣农博物馆\u003c/strong>\u003cspan>以产业、科技与时间为线索，认识圣农。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/breeding\">自主育种\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>INDEPENDENT BREEDING\u003c/span>\u003cstrong>自主育种\u003c/strong>\u003cp>以圣泽 901 打破白羽肉鸡种源依赖，让中国种源安全掌握在自己手中。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/breeding/shengze\">\u003cstrong>圣泽简介\u003c/strong>\u003cspan>聚焦白羽肉鸡种源自主研发与产业化应用。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/history\">\u003cstrong>育种历程\u003c/strong>\u003cspan>从技术攻关到新品种产业化的关键节点。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/certificates\">\u003cstrong>荣誉证书\u003c/strong>\u003cspan>查看新品种证书与相关专业认可。\u003c/span>\u003c/a>\u003ca href=\"#/breeding/news\">\u003cstrong>相关新闻\u003c/strong>\u003cspan>关注自主育种进展与产业资讯。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"nav-item\">\u003ca href=\"#/products\">旗下产品\u003c/a>\u003cdiv class=\"mega-menu\">\u003cdiv class=\"mega-intro\">\u003cspan>OUR PRODUCTS\u003c/span>\u003cstrong>旗下产品\u003c/strong>\u003cp>从品质生鲜到便捷熟食，让专业的食品智造走进更多餐桌。\u003c/p>\u003c/div>\u003cdiv class=\"mega-links\">\u003ca href=\"#/products/sunner\">\u003cstrong>圣农\u003c/strong>\u003cspan>熟食、生食及多元场景的鸡肉产品解决方案。\u003c/span>\u003c/a>\u003ca href=\"#/products/sunvalley\">\u003cstrong>太阳谷\u003c/strong>\u003cspan>品质鲜品、美味调理与便捷熟食。\u003c/span>\u003c/a>\u003ca href=\"#/products/safety\">\u003cstrong>食品安全\u003c/strong>\u003cspan>用全链路标准守护每一份产品的稳定品质。\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv clas
